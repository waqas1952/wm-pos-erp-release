# Builds the Windows installer on GitHub's own Windows machine and publishes it,
# with latest.yml, to the public repo waqas1952/wm-pos-erp-release. Installed
# copies of WM POS ERP check that repo for updates.
#
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Needs one secret in THIS repo: RELEASES_TOKEN — a token that can write to
# waqas1952/wm-pos-erp-release (Contents: Read and write).
#
# The project can be in this repo either as normal files, or as a single
# wm-pos-erp-source.zip at the top level — the zip is unpacked first.
# To ship a new version, raise "version" in package.json; pushing the same
# version again does not replace an already published release.

name: Build & Release (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack wm-pos-erp-source.zip (if the project was uploaded as a zip)
        shell: pwsh
        run: |
          if (Test-Path wm-pos-erp-source.zip) {
            Expand-Archive -Path wm-pos-erp-source.zip -DestinationPath _src -Force
            # The zip may hold the files directly or inside one folder
            $root = if (Test-Path _src/package.json) { '_src' } else { (Get-ChildItem _src -Directory | Select-Object -First 1).FullName }
            Copy-Item -Path "$root/*" -Destination . -Recurse -Force
            Remove-Item _src -Recurse -Force
          }
          if (-not (Test-Path package.json)) {
            Write-Error "package.json nahi mili. Repo mein project files ya wm-pos-erp-source.zip upload karein."
            exit 1
          }
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Building WM POS ERP version $v"

      - name: Check the release token
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Error "RELEASES_TOKEN secret nahi mila. Repo Settings > Secrets and variables > Actions mein add karein."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Build installer and publish to wm-pos-erp-release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Keep a copy of the installer on this run
        uses: actions/upload-artifact@v4
        with:
          name: WM-POS-ERP-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn
